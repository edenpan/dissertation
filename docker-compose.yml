version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: dissertation-mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: stockdb
      MYSQL_USER: runner
      MYSQL_PASSWORD: tester
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
